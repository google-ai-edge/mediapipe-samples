version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/android-common"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      mediapipe:
        patterns:
          - "com.google.mediapipe:*"
          - "com.google.ai.edge.litertlm:*"
      androidx-compose:
        patterns:
          - "androidx.*"
