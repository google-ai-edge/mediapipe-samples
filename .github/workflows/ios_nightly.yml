name: iOS Nightly Build Test

on:
  schedule:
    # Run every day at 02:00 UTC (nightly)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      example:
        description: 'Specific iOS example to test (or "all")'
        required: false
        default: 'all'
  pull_request:
    paths:
      - '.github/workflows/ios_nightly.yml'
      - '.github/scripts/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.example || 'all' }}
  cancel-in-progress: true

jobs:
  detect-examples:
    name: Auto-detect iOS Examples
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Detect iOS Examples
        id: detect
        env:
          INPUT_EXAMPLE: ${{ inputs.example || 'all' }}
        run: |
          MATRIX_JSON=$(python3 .github/scripts/detect_ios_examples.py --example "$INPUT_EXAMPLE")
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  build-ios:
    name: Build iOS Sample (${{ matrix.name }})
    needs: detect-examples
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-examples.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Cache Swift Package Manager dependencies
        if: ${{ !matrix.has_podfile }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ matrix.name }}-${{ hashFiles(format('{0}/{1}/project.pbxproj', matrix.path, matrix.project)) }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ matrix.name }}-
            ${{ runner.os }}-spm-

      - name: Cache CocoaPods dependencies
        if: ${{ matrix.has_podfile }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.path }}/Pods
          key: ${{ runner.os }}-pods-${{ matrix.name }}-${{ hashFiles(format('{0}/Podfile.lock', matrix.path)) }}
          restore-keys: |
            ${{ runner.os }}-pods-${{ matrix.name }}-

      - name: Install CocoaPods dependencies
        if: ${{ matrix.has_podfile }}
        working-directory: ${{ matrix.path }}
        run: pod install --repo-update

      - name: Stub models referenced by Xcode build system
        env:
          EXAMPLE_PATH: ${{ matrix.path }}
          EXAMPLE_PROJECT: ${{ matrix.project }}
        run: python3 .github/scripts/stub_ios_models.py "$EXAMPLE_PATH/$EXAMPLE_PROJECT"

      - name: Build iOS Application (${{ matrix.name }})
        working-directory: ${{ matrix.path }}
        env:
          HAS_PODFILE: ${{ matrix.has_podfile }}
          PROJECT: ${{ matrix.project }}
          SCHEME: ${{ matrix.scheme }}
        run: |
          if [ "$HAS_PODFILE" = "true" ]; then
            WORKSPACE_NAME="${PROJECT%.xcodeproj}.xcworkspace"
            TARGET_FLAG="-workspace $WORKSPACE_NAME"
          else
            TARGET_FLAG="-project $PROJECT"
          fi

          xcodebuild build \
            $TARGET_FLAG \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
