name: Android Text Classifier CI

on:
  pull_request:
    paths:
      - 'examples/text_classification/android/**'
      - 'android-common/**'
      - '.github/workflows/android_text_classifier.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-stub-build:
    name: Unit Tests & Stubbed Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run shared unit tests
        working-directory: examples/text_classification/android
        run: |
          chmod +x ./gradlew
          ./gradlew :android-common:testing:testDebugUnitTest --no-daemon --stacktrace

      - name: Verify stubbed compile-only build compatibility
        run: |
          python3 .github/scripts/stub_android_models.py examples/text_classification/android
          cd examples/text_classification/android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

  instrumented-real-model-tests:
    name: Real-Model Quality & UI Tests
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache verified model assets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: examples/text_classification/android/app/src/main/assets
          key: text-classifier-models-${{ hashFiles('examples/text_classification/android/app/download_model.gradle') }}

      - name: Download and verify real models
        working-directory: examples/text_classification/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:verifyModels --no-daemon --stacktrace

      - name: Run instrumented quality & UI tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disk-size: 8G
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          disable-spellchecker: true
          working-directory: examples/text_classification/android
          script: |
            adb logcat -c || true
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
            adb logcat -d -s LatencyRecorder | python3 ../../../.github/scripts/extract_latency_reports.py ../../../build/latency_reports

      - name: Upload report-only latency JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: text-classifier-latency-reports
          path: build/latency_reports/**
          if-no-files-found: ignore
