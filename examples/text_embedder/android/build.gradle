plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.kotlin.compose) apply false
    alias(libs.plugins.undercouch.download) apply false
}

// Optional canary / release-verification override:
//   ./gradlew assembleDebug -PmediapipeVersion=1.3.0
//   ./gradlew connectedDebugAndroidTest -PmediapipeVersion=1.3.0-rc1 -PrequireLocalMediapipeRepo=true
def overrideMediapipeVersion = providers.gradleProperty('mediapipeVersion').orNull
def requireLocalMediapipeRepo = providers.gradleProperty('requireLocalMediapipeRepo')
        .map { it.toBoolean() }.getOrElse(false)

if (overrideMediapipeVersion || requireLocalMediapipeRepo) {
    def expectedVersion = overrideMediapipeVersion
    def localM2Root = new File(System.getProperty('user.home'), '.m2/repository').toPath().toAbsolutePath().normalize()

    subprojects {
        configurations.configureEach { config ->
            if (expectedVersion) {
                config.resolutionStrategy.eachDependency { details ->
                    if (details.requested.group == 'com.google.mediapipe' &&
                            details.requested.name.startsWith('tasks-')) {
                        details.useVersion(expectedVersion)
                        details.because("Overridden via -PmediapipeVersion=$expectedVersion")
                    }
                }
            }
            if (requireLocalMediapipeRepo && config.isCanBeResolved()) {
                config.incoming.afterResolve { resolvable ->
                    def violations = []
                    resolvable.resolutionResult.allComponents.each { component ->
                        if (component.moduleVersion?.group == 'com.google.mediapipe') {
                            def name = component.moduleVersion.name
                            def ver = component.moduleVersion.version
                            def groupPath = 'com/google/mediapipe'
                            def pomPath = localM2Root.resolve("$groupPath/$name/$ver/$name-${ver}.pom").toFile()
                            if (!pomPath.exists()) {
                                violations << "${component.moduleVersion} (missing in $localM2Root)"
                            }
                        }
                    }
                    if (!violations.isEmpty()) {
                        throw new GradleException(
                                "requireLocalMediapipeRepo=true failed for configuration '${config.name}': " +
                                        "artifacts not found in ~/.m2/repository: ${violations.unique().join(', ')}"
                        )
                    }
                }
            }
        }
    }
}
