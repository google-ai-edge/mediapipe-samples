// Kokoro 82M LiteRT-LM model (~82M parameters, int8 quantized bundle).
// Push the model directly to the device external files directory (recommended):
//   adb push kokoro.litertlm /sdcard/Android/data/com.google.mediapipe.tasks.audio.texttospeech.examples/files/
//
// Or download and bundle into the APK assets by running:
//   ./gradlew downloadKokoroModel
//
task downloadKokoroModel(type: Download) {
    String modelUrl = project.findProperty('KOKORO_MODEL_URL') ?: System.getenv('KOKORO_MODEL_URL') ?: ''
    if (!modelUrl.isEmpty()) {
        src modelUrl
        dest project.ext.ASSET_DIR + '/kokoro.litertlm'
        overwrite false
    }
}
