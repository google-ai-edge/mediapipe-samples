plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.navigation.safeargs'
}

android {
    namespace "com.google.mediapipe.examples.universalembedder"
    compileSdk 36

    defaultConfig {
        applicationId "com.google.mediapipe.examples.universalembedder"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += ['-Xskip-metadata-version-check']
    }

    buildFeatures {
        viewBinding true
    }

    androidResources {
        noCompress 'tflite', 'litertlm'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.5.4'

    def nav_version = "2.4.2"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    implementation 'androidx.window:window:1.1.0-alpha02'
    
    // MediaPipe UniversalEmbedder
    implementation 'com.google.mediapipe:tasks-retrieval:1.1.0'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0'
}
