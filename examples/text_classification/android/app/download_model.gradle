import java.security.MessageDigest

def sha256Hex = { File file ->
    def digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { is ->
        byte[] buf = new byte[8192]
        int read
        while ((read = is.read(buf)) > 0) {
            digest.update(buf, 0, read)
        }
    }
    digest.digest().collect { String.format('%02x', it) }.join('')
}

def mobileBertFile = file(project.ext.ASSET_DIR + '/mobilebert.tflite')
def mobileBertSha256 = '9b45012ab143d88d61e10ea501d6c8763f7202b86fa987711519d89bfa2a88b1'

def wordVecFile = file(project.ext.ASSET_DIR + '/wordvec.tflite')
def wordVecSha256 = '13bf6f7f35964f1e85d6cc762ee7b1952009b532b233baa5bdb4bf7441097f34'

// Both models may be generated by https://www.tensorflow.org/lite/
// models/modify/model_maker/text_classification
task downloadMobileBERTTextClassifierModel(type: Download) {
    src 'https://storage.googleapis.com/mediapipe-models/text_classifier/bert_classifier/float32/1/bert_classifier.tflite'
    dest project.ext.ASSET_DIR + '/mobilebert.tflite'
    overwrite false
    onlyIf { !mobileBertFile.exists() }
    doLast {
        def actual = sha256Hex(mobileBertFile)
        if (actual != mobileBertSha256) {
            mobileBertFile.delete()
            throw new GradleException("Checksum mismatch for mobilebert.tflite: expected $mobileBertSha256, got $actual")
        }
    }
}

task downloadWordVecTextClassifierModel(type: Download) {
    src 'https://storage.googleapis.com/mediapipe-models/text_classifier/average_word_classifier/float32/1/average_word_classifier.tflite'
    dest project.ext.ASSET_DIR + '/wordvec.tflite'
    overwrite false
    onlyIf { !wordVecFile.exists() }
    doLast {
        def actual = sha256Hex(wordVecFile)
        if (actual != wordVecSha256) {
            wordVecFile.delete()
            throw new GradleException("Checksum mismatch for wordvec.tflite: expected $wordVecSha256, got $actual")
        }
    }
}

task verifyModels {
    dependsOn downloadMobileBERTTextClassifierModel, downloadWordVecTextClassifierModel
    doLast {
        [
            [mobileBertFile, mobileBertSha256, 'mobilebert.tflite'],
            [wordVecFile, wordVecSha256, 'wordvec.tflite'],
        ].each { entry ->
            File f = entry[0]
            String expected = entry[1]
            String name = entry[2]
            if (!f.exists() || f.length() == 0L) {
                throw new GradleException("Model $name is missing or empty (stubbed?). Delete it and re-run to download.")
            }
            def actual = sha256Hex(f)
            if (actual != expected) {
                throw new GradleException("Checksum mismatch for $name: expected $expected, got $actual")
            }
        }
    }
}

preBuild.dependsOn downloadMobileBERTTextClassifierModel,
        downloadWordVecTextClassifierModel
