plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'de.undercouch.download'
}

android {
    namespace 'com.google.mediapipe.tasks.examples.audiotranscriber'
    compileSdk 34

    defaultConfig {
        applicationId "com.google.mediapipe.tasks.examples.audiotranscriber"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += ['-Xskip-metadata-version-check']
    }
    buildFeatures {
        compose true
    }

    androidResources {
        noCompress 'litertlm'
        noCompress 'task'
        noCompress 'tflite'
    }

    packaging {
        jniLibs {
            pickFirsts += ['**/libfilterframework_jni.so']
        }
    }
}

// import DownloadModels task
project.ext.ASSET_DIR = projectDir.toString() + '/src/main/assets'
project.ext.TEST_ASSET_DIR = projectDir.toString() + '/src/androidTest/assets'

apply from: 'download_model.gradle'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0'
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // MediaPipe Tasks Audio library (providing AudioTranscriber task)
    // Resolved from libs/ if present, otherwise maven repository
    if (file('libs/tasks_audio.aar').exists()) {
        if (!file('libs/protobuf_lite.jar').exists()) {
            implementation 'com.google.protobuf:protobuf-javalite:4.26.1'
        }
        implementation 'com.google.flogger:flogger:0.6'
        implementation 'com.google.flogger:flogger-system-backend:0.6'
        implementation 'com.google.guava:guava:27.0.1-android'
        if (!file('libs/tasks_core.aar').exists()) {
            implementation 'com.google.mediapipe:tasks-core:latest.release'
        }
    } else {
        implementation 'com.google.mediapipe:tasks-audio:latest.release'
    }
}
