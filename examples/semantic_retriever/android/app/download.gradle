// Placeholder for automatic model provisioning.
//
// EmbeddingGemma V2 (.litertlm) is not published to a public endpoint yet, so for now the
// model has to be placed in app/src/main/assets manually:
//
//     app/src/main/assets/embedding_gemma_v2_q4c_multisig.litertlm
//
// Once the model is available on Hugging Face, fill in HF_MODEL_URL below and uncomment the
// `preBuild.dependsOn` line at the bottom. Gradle will then fetch it at build time and the
// checked-in copy can be dropped from the repo (it is ~470 MB).

ext {
    ASSET_DIR = projectDir.toString() + '/src/main/assets'
    EMBEDDING_MODEL = 'embedding_gemma_v2_q4c_multisig.litertlm'

    // TODO(mediapipe): point this at the public Hugging Face resolve URL once the model ships,
    // e.g. 'https://huggingface.co/google/embeddinggemma-v2/resolve/main/' + EMBEDDING_MODEL
    HF_MODEL_URL = ''
}

task downloadEmbeddingModel(type: Download) {
    // Guards against running with an empty placeholder URL.
    onlyIf { !project.ext.HF_MODEL_URL.isEmpty() }

    src project.ext.HF_MODEL_URL
    dest project.ext.ASSET_DIR + '/' + project.ext.EMBEDDING_MODEL
    overwrite false

    doFirst {
        println "Downloading ${project.ext.EMBEDDING_MODEL} from Hugging Face…"
    }
}

// TODO(mediapipe): uncomment once HF_MODEL_URL is set.
// preBuild.dependsOn downloadEmbeddingModel
