// EmbeddingGemma 2 270M (default model, ~165 MB) is bundled into the APK assets on every build.
task downloadEmbeddingGemmaModel(type: Download) {
    src 'https://huggingface.co/litert-community/embeddinggemma-2-text-270m-litert-lm/resolve/main/embeddinggemma-2-text-270m.litertlm'
    dest project.ext.ASSET_DIR + '/embeddinggemma-2-text-270m.litertlm'
    overwrite false
}

// Laya S256 (~680 MB) is bundled into the APK assets on every build.
task downloadLayaModel(type: Download) {
    src 'https://storage.googleapis.com/mediapipe-models/decision_maker/laya/float32/laya_s256/latest/laya_s256.task'
    dest project.ext.ASSET_DIR + '/laya_s256.task'
    overwrite false
}

// GLiNER S256 (~980 MB) is not bundled, to keep the APK small: push it to the device instead
// (see README), or uncomment this task and run `./gradlew downloadGlinerModel` to bundle it.
// task downloadGlinerModel(type: Download) {
//     src 'https://storage.googleapis.com/mediapipe-models/decision_maker/gliner/float16/gliner_s256/latest/gliner_s256.task'
//     dest project.ext.ASSET_DIR + '/gliner_s256.task'
//     overwrite false
// }

preBuild.dependsOn downloadEmbeddingGemmaModel
preBuild.dependsOn downloadLayaModel
